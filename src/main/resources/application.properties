spring.application.name=FarmaSol-Back

# Puerto del servidor
server.port=8080

# Configuración de Base de Datos MySQL (Workbench / Local)
# NOTA: Cambia 'farmasol_db', 'root' y 'tu_password' según tu configuración de MySQL Workbench
spring.datasource.url=jdbc:mysql://localhost:3306/farmasol_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=admin123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
